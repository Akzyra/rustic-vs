[package]
name = "rustic-vs"
version = "0.1.0"
edition = "2024"
authors = ["Akzyra"]
license = "MIT"
readme = "README.md"

[dependencies]
log = "0.4"
fern = "0.7"
humantime = "2"
thiserror = "2"
filenamify = "0.1.2"
freya = { version = "0.5.0-rc.7", features = ["i18n", "router", "icons-lucide"] }
serde = { version = "1", features = ["derive"] }
json5 = "1.3"
rss = "2.1"
reqwest = "0.13"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

[features]
debug = ["freya/devtools"]
