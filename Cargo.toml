[package]
name = "rustic-vs"
version = "0.1.0"
edition = "2024"
authors = ["Akzyra"]
license = "MIT"
readme = "README.md"

[dependencies]
log = "0.4.34"
fern = "0.7.1"
humantime = "2.4.0"
thiserror = "2.0.20"
filenamify = "0.1.2"
freya = { version = "0.4", features = ["i18n", "icons", "router", "icons-lucide"] }
serde = { version = "1.0", features = ["derive"] }
json5 = "1.3.1"
rss = "2.1.0"
reqwest = "0.13.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4.45"
